let rx=-.2,ry=0,dr=null,mv=0;
(function sp(){requestAnimationFrame(sp);if(!dr)ry+=.004;ring.style.transform=`rotateX(${rx}rad) rotateY(${ry}rad)`})();
const g2=$('#s2');
g2.onpointerdown=e=>{dr=[e.clientX,e.clientY];mv=0};
g2.onpointermove=e=>{if(!dr)return;const dx=e.clientX-dr[0],dy=e.clientY-dr[1];mv+=Math.abs(dx)+Math.abs(dy);ry+=dx*.008;rx=Math.max(-1.2,Math.min(1.2,rx-dy*.008));dr=[e.clientX,e.clientY]};
g2.onpointerup=e=>{dr=null;if(mv<6){const c=e.target.closest('.cd');if(c){const k=c.cloneNode(true);k.style.transform='none';k.style.backgroundSize='contain';k.style.backgroundColor='#000';$('#lb').replaceChildren(k);$('#lb').classList.add('on')}}};
$('#lb').onclick=()=>$('#lb').classList.remove('on');
$('#nx').onclick=()=>{const audio=document.getElementById('bgMusic');if(audio){audio.pause();audio.currentTime=0}
const letterMusic=document.getElementById('letterMusic');
if(letterMusic){letterMusic.play().then(()=>{console.log('Đã phát nhạc mở thư thành công!')}).catch(error=>{console.log('Lỗi phát nhạc thư:',error)})}
show(3);$('#env').style.display='flex';$('#eh').style.display='block';$('#lt').classList.remove('on');$('#rp').style.display='none';$('#hr').classList.remove('on')};
/* letter */
const MSG='Nhân ngày Phụ nữ Việt Nam 20/10, con chúc mẹ luôn mạnh khỏe, vui vẻ và sống thật lâu bên tụi con. Với con, mẹ luôn là người phụ nữ tuyệt vời nhất trên đời. Cảm ơn mẹ vì tất cả những điều dịu dàng mẹ đã dành cho con!';
let typing=0;
$('#env').onclick=async()=>{if(typing)return;typing=1;$('#env').style.display='none';$('#eh').style.display='none';$('#lt').classList.add('on');
for(let i=0;i<=MSG.length;i++){$('#a').textContent=MSG.slice(0,i);$('#b').textContent=MSG.slice(i);await sl(40)}
$('#hr').classList.add('on');$('#rp').style.display='block';typing=0};
$('#rp').onclick=()=>show(0);
</script></body></html>
